name: build-apk
# สร้างไฟล์ APK ของ Meowrin (กดรันเองเท่านั้น ไม่รันอัตโนมัติ)
# ใช้กุญแจเซ็นแอพชุดเดียวกันทุกครั้ง (tools/debug.keystore ตั้งใน build.gradle signingConfigs.debug + มีขั้นตรวจลายเซ็นท้ายงาน ไม่ตรง = งานล้ม) → ติดตั้งทับเวอร์ชันเก่าได้ ข้อมูลในแอพไม่หาย
# (ถ้าเคยติดตั้ง APK ที่สร้างจาก repo เว็บแอปเดิม ต้องลบตัวนั้นออกก่อนติดตั้งครั้งแรก เพราะกุญแจคนละชุด)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bundled (แนะนำ) = ห่อโค้ดไว้ใน APK หน้าอยู่ที่ https://localhost อ่านไฟล์วิดีโอได้ แล้ว ota.js อัปเดตโค้ดจาก GitHub Pages เอง · live = โหลดโค้ดจากเว็บตลอด (หน้าอยู่ที่ github.io อ่านข้อมูลภาพจากไฟล์ในมือถือไม่ได้ ติด CORS)"
        type: choice
        options: [bundled, live]
        default: bundled
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: เตรียมโฟลเดอร์ห่อแอพ
        env:
          MODE: ${{ github.event.inputs.mode }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p wrap/www
          rsync -a --exclude '.git' --exclude '.github' --exclude 'wrap' --exclude 'tests' --exclude 'tools' --exclude '*.md' --exclude '*.mjs' --exclude '*.test.mjs' ./ wrap/www/
          cd wrap
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/app@7 @capacitor-community/keep-awake@7 @capacitor-community/media@8.0.1
          python3 - <<'PY1'
          import json, os
          cfg = {"appId": "com.han.meowrin", "appName": "Meowrin App", "webDir": "www", "backgroundColor": "#0b0e0d",
                 "android": {"adjustMarginsForEdgeToEdge": "force"}, "plugins": {"Media": {"androidGalleryMode": True}}}
          if os.environ.get("MODE", "bundled") == "live":
              cfg["server"] = {"url": "https://hxyhan2006-code.github.io/Meowrin-apk/", "cleartext": False}
          json.dump(cfg, open("capacitor.config.json", "w"), indent=2)
          PY1
          npx cap add android
          # ล็อกกุญแจเซ็นเป็น tools/debug.keystore ตรงๆ (เดิมแค่ copy ไปที่ ~/.android แต่ Gradle ไม่ได้ใช้ ทำให้ทุกรอบเซ็นด้วยกุญแจสุ่มใหม่ → ติดตั้งทับไม่ได้)
          cp ../tools/debug.keystore android/app/debug.keystore
          python3 - <<'PY3'
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          blk = 'android {\n    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n'
          assert "\nandroid {\n" in s, "ไม่เจอบล็อก android { ใน build.gradle"
          s = s.replace("\nandroid {\n", "\n" + blk, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY3
          sed -i "s/versionCode 1/versionCode ${RUN_NUMBER}/" android/app/build.gradle  # APK ใหม่ = Capacitor ทิ้งชุดไฟล์ OTA ที่จำไว้ กลับไปใช้ไฟล์ที่ห่อมา (ทางรีเซ็ตถ้า OTA พัง)
          pip install --quiet pillow
          python3 ../tools/android-icons.py android/app/src/main/res www/icon-512.png
          # ปลั๊กอินสั่งสแกนสื่อ (MediaScannerConnection): Filesystem เขียนไฟล์ลง Documents แล้วแกลเลอรี/CapCut ไม่เห็นเพราะไม่มีใครสั่งสแกน · ปลั๊กอิน Media ใช้วิธีสแกนแบบเก่าที่ Android 10+ ไม่ทำงาน
          python3 - <<'PY4'
          import os
          d = "android/app/src/main/java/com/han/meowrin"
          assert os.path.isdir(d), "ไม่เจอโฟลเดอร์ java ของแอพ: " + d
          open(d + "/MediaScanPlugin.java", "w", encoding="utf-8").write('''package com.han.meowrin;

          import android.content.Intent;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "MediaScan")
          public class MediaScanPlugin extends Plugin {
              @PluginMethod
              public void scan(final PluginCall call) {
                  String path = call.getString("path");
                  if (path == null) { call.reject("path is required"); return; }
                  if (path.startsWith("file://")) path = Uri.decode(path.substring(7));
                  String mime = call.getString("mime", "video/mp4");
                  MediaScannerConnection.scanFile(getContext(), new String[] { path }, new String[] { mime }, new MediaScannerConnection.OnScanCompletedListener() {
                      @Override
                      public void onScanCompleted(String p, Uri uri) {
                          JSObject r = new JSObject();
                          r.put("path", p);
                          r.put("uri", uri == null ? "" : uri.toString());
                          r.put("indexed", uri != null);
                          call.resolve(r);
                      }
                  });
              }

              private String plain(String p) {
                  return p != null && p.startsWith("file://") ? Uri.decode(p.substring(7)) : p;
              }

              @PluginMethod
              public void hasAccess(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("granted", Build.VERSION.SDK_INT < 30 || Environment.isExternalStorageManager());
                  call.resolve(r);
              }

              @PluginMethod
              public void requestAccess(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 30) {
                      Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  }
                  call.resolve();
              }

              // ย้ายไฟล์: rename ก่อน (เร็ว ไม่กินที่) ไม่ได้ค่อยก๊อป+ตรวจขนาด+ลบต้นทาง · ไม่ทับไฟล์ปลายทาง · แจ้งแกลเลอรีทั้งที่เก่าและใหม่
              @PluginMethod
              public void move(PluginCall call) {
                  String from = plain(call.getString("from")), to = plain(call.getString("to"));
                  if (from == null || to == null) { call.reject("from/to is required"); return; }
                  File src = new File(from), dst = new File(to);
                  if (!src.isFile()) { call.reject("source missing: " + from); return; }
                  if (dst.exists()) { call.reject("target exists: " + to); return; }
                  File dir = dst.getParentFile();
                  if (dir != null && !dir.exists() && !dir.mkdirs()) { call.reject("cannot create folder: " + dir); return; }
                  boolean ok = src.renameTo(dst);
                  if (!ok) {
                      try {
                          try (FileInputStream in = new FileInputStream(src); FileOutputStream out = new FileOutputStream(dst)) {
                              byte[] buf = new byte[1 << 20];
                              int n;
                              while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                              out.getFD().sync();
                          }
                          if (dst.length() != src.length()) { dst.delete(); call.reject("copy size mismatch"); return; }
                          if (!src.delete()) { dst.delete(); call.reject("cannot delete source"); return; }
                      } catch (Exception e) {
                          dst.delete();
                          call.reject("move failed: " + e);
                          return;
                      }
                  }
                  MediaScannerConnection.scanFile(getContext(), new String[] { from, to }, null, null);
                  JSObject r = new JSObject();
                  r.put("to", to);
                  call.resolve(r);
              }
          }
          ''')
          open(d + "/MainActivity.java", "w", encoding="utf-8").write('''package com.han.meowrin;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaScanPlugin.class);
                  registerPlugin(StreakPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          ''')
          PY4
          # ไฟวันต่อเนื่องฝั่งเนทีฟ (วิดเจ็ต + แจ้งเตือน + ปลุกเฉพาะเวลาแจ้งเตือน ไม่เช็กเน็ตเบื้องหลัง): ซอร์สอยู่ใน tools/android/ (ไม่อยู่ใน OTA)
          cp ../tools/android/java/*.java android/app/src/main/java/com/han/meowrin/
          for d in layout xml drawable; do mkdir -p android/app/src/main/res/$d; cp ../tools/android/res/$d/*.xml android/app/src/main/res/$d/; done
          # มาสคอตแมว (วิดเจ็ต/แจ้งเตือน): mascot/<ท่า>.png → res/drawable-nodpi/mw_<ท่า>.png (ท่าใหม่ = ต้องสร้าง APK ใหม่)
          mkdir -p android/app/src/main/res/drawable-nodpi
          for f in ../mascot/*.png; do cp "$f" "android/app/src/main/res/drawable-nodpi/mw_$(basename "$f")"; done
          # ฉากพื้นหลังวิดเจ็ต stk_bg_<ฉาก>_<อารมณ์>.png (สร้างจาก tools/widget/scenes.py)
          cp ../tools/android/res/drawable-nodpi/*.png android/app/src/main/res/drawable-nodpi/
          # เสียงแจ้งเตือนมาสคอต stk_snd_<ชื่อ>.mp3 (สร้างจาก tools/sound/make.py) → res/raw
          mkdir -p android/app/src/main/res/raw
          cp ../tools/android/res/raw/*.mp3 android/app/src/main/res/raw/
          # ฟอนต์ Mitr (ตัวหนังสือวิดเจ็ต วาดด้วย Canvas = StreakArt.text) · OFL · แปลงจาก fonts/Mitr-500-*.woff2
          mkdir -p android/app/src/main/assets
          cp ../tools/android/fonts/mitr.ttf android/app/src/main/assets/mitr.ttf
          python3 - <<'PY2'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = "".join('    <uses-permission android:name="android.permission.%s" />\n' % n for n in [
              "READ_MEDIA_VIDEO", "READ_MEDIA_IMAGES", "READ_MEDIA_AUDIO", "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE", "MANAGE_EXTERNAL_STORAGE", "WAKE_LOCK", "POST_NOTIFICATIONS", "RECEIVE_BOOT_COMPLETED", "VIBRATE"])
          s = s.replace("<application", perms + "    <application", 1)
          s = s.replace("<application", '<application android:requestLegacyExternalStorage="true" android:largeHeap="true"', 1)
          assert "</application>" in s, "ไม่เจอ </application> ใน AndroidManifest.xml"
          s = s.replace("</application>", """        <receiver android:name=".StreakWidget" android:exported="true" android:label="ไฟวันต่อเนื่อง">
                    <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                    <meta-data android:name="android.appwidget.provider" android:resource="@xml/streak_widget_info" />
                </receiver>
                <receiver android:name=".StreakAlarm" android:exported="false">
                    <intent-filter>
                        <action android:name="android.intent.action.BOOT_COMPLETED" />
                        <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                    </intent-filter>
                </receiver>
            </application>""", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY2
          npx cap sync android
      - name: สร้าง APK
        working-directory: wrap/android
        run: ./gradlew assembleDebug --no-daemon
      - name: ตรวจลายเซ็น/เลขเวอร์ชันของ APK (ไว้ดูว่าทำไมติดตั้งทับไม่ได้)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=wrap/android/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256\|DN:\|Verifies"
          "$BT/aapt" dump badging "$APK" | grep -i "^package:\|sdkVersion\|targetSdk"
          echo "run_number=${{ github.run_number }}"
          WANT=$(keytool -list -v -keystore tools/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep "SHA-256 digest" | head -1 | sed 's/.*: //')
          echo "ลายเซ็นที่ต้องการ=$WANT"; echo "ลายเซ็นของ APK =$GOT"
          [ "$WANT" = "$GOT" ] || { echo "ลายเซ็นของ APK ไม่ตรงกับ tools/debug.keystore"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: meowrin-apk
          path: wrap/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
